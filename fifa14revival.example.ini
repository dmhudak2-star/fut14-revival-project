; fifa14revival.ini -- où le revival se trouve.
;
; Copier ce fichier en `fifa14revival.ini` et l'adapter. Il n'est pas
; obligatoire : sans lui, tout garde les valeurs ci-dessous, qui sont celles
; sur lesquelles le projet tourne depuis le début.
;
; Le même fichier a deux lecteurs. Sur la machine qui développe,
; `tools/fut.sh` et les patcheurs le lisent. Sur une console, c'est le plugin
; Dashlaunch décrit dans `docs/RELEASE.md` qui le lira, posé à côté de lui.
; Une seule réponse à « quelle adresse », pas deux.

[server]

; L'adresse que la console doit joindre.
;
; `auto` = l'adresse LAN de cette machine, résolue à chaque lancement. Ce
; n'est pas du confort : le DHCP a déjà déplacé cette adresse une fois, et une
; valeur périmée est **silencieuse** — le titre démarre normalement puis échoue
; au premier connect Blaze, sans rien dans le journal, puisque rien n'a jamais
; atteint le serveur.
;
; Mettre une valeur littérale pour pointer ailleurs : une IP fixe, ou un nom
; d'hôte si le serveur est hébergé.
host = auto

; Blaze.
core_port = 10041

; HTTP : les routes FUT, les ressources, `futBoot.xml`.
identity_port = 18080

[console]

; Cette section ne sert qu'au lanceur sur une machine de développement. Un
; plugin qui tourne sur la console sait déjà sur quelle console il est.

; L'adresse XBDM de la console.
address = 192.168.1.25

; Le titre à lancer, tel que `magicboot` l'attend.
title = Hdd:\Games\FIFA 14
